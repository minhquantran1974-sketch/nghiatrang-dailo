<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Phần mộ Nghĩa trang GX Đại Lộ</title>

<style>
/* Sổ tra cứu: thanh lọc cố định phía trên, mỗi dòng là một người, bấm để xem ảnh ngôi mộ. */
:root{
  --bg:#f3f2ee; --panel:#fbfaf7; --fg:#1d2420; --muted:#5d6760; --line:#d9d6cd;
  --accent:#3b5b4c; --accent-fg:#ffffff; --warn-bg:#f6ead0; --warn-fg:#6b4a0c; --chip:#e7e5dc; --miss:#9a5b13;
  --display:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b221f; --fg:#e8ebe6; --muted:#9aa59d; --line:#2e3833;
  --accent:#8fb9a3; --accent-fg:#0f1512; --warn-bg:#3a2f14; --warn-fg:#f0d28a; --chip:#26302b; --miss:#e0a95e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b221f; --fg:#e8ebe6; --muted:#9aa59d; --line:#2e3833;
  --accent:#8fb9a3; --accent-fg:#0f1512; --warn-bg:#3a2f14; --warn-fg:#f0d28a; --chip:#26302b; --miss:#e0a95e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-block:0 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto}
header{padding:22px 0 12px}
h1{font:600 30px/1.15 var(--display);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.range{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
label{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 8px;min-height:42px}
input:focus-visible,select:focus-visible,button:focus-visible,.row:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;margin:0;text-transform:none;letter-spacing:0;font-size:13px}
.opts input[type=checkbox]{width:auto;min-height:0}
.opts select{width:auto;min-height:34px;padding:4px 8px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;min-height:38px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.count{margin:14px 0 8px;font-size:14px;color:var(--muted)}
.count b{color:var(--fg);font-variant-numeric:tabular-nums}
.count.tot{font-size:16px;color:var(--fg);background:var(--chip);border-radius:8px;padding:10px 12px}
.count.tot b{font-size:22px;color:var(--accent)}
.stat{margin:0 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stat summary{cursor:pointer;padding:11px 14px;font-weight:600;min-height:44px}
.stat #statbody{padding:4px 14px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.sctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:4px 14px 10px}
.sctl label{margin:0;font-size:12px}.sctl input,.sctl select{min-height:36px;padding:4px 8px;width:auto}.sctl input{width:96px}
.sum{grid-column:1/-1;background:var(--chip);border-radius:8px;padding:10px 12px;font-size:15px}.sum b{color:var(--accent);font-size:20px}
.ytab{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:380px}
.ytab table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.ytab th,.ytab td{padding:5px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ytab th:first-child,.ytab td:first-child{text-align:left}.ytab thead th{position:sticky;top:0;background:var(--panel);font-weight:600}
.ytab tfoot td{font-weight:700;background:var(--chip)}
.ytab .bc{width:100%;min-width:90px;text-align:left}.ytab .bc i{display:inline-block;height:9px;border-radius:2px;background:var(--accent);vertical-align:middle}
details.adv{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}details.adv summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--muted)}
details.adv .grid{padding:4px 12px 8px;grid-template-columns:1fr 1fr}
.people{display:flex;flex-direction:column;gap:3px;margin-top:4px;font-size:14px}.people b{font-weight:600}
.same{font-size:12.5px;color:var(--muted);margin-top:3px}
.photo{display:block;margin-bottom:8px}.photo img{display:block;width:100%;height:auto;min-height:220px;border-radius:6px;background:#141414}
.noimg{padding:14px;border-radius:6px;background:var(--warn-bg);color:var(--warn-fg);font-size:13px;margin-bottom:8px}
.card{max-width:760px}
.row.g{grid-template-columns:84px minmax(0,1fr)}
@media (max-width:900px){.bar{position:static}}
@media (max-width:700px){details.adv .grid{grid-template-columns:1fr}.row.g{grid-template-columns:72px minmax(0,1fr)}}
.stat h3{font:600 15px/1.2 var(--display);margin:6px 0 8px}
.bars{display:flex;flex-direction:column;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.bar1{display:grid;grid-template-columns:86px 1fr 34px;gap:8px;align-items:center}
.bar1 i{display:block;height:10px;border-radius:3px;background:var(--accent);min-width:2px}
.yrscroll{max-height:260px;overflow:auto;padding-right:4px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:40px 84px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;color:inherit;min-height:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--chip)}
.stt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.th{width:84px;height:66px;border-radius:4px;background-color:#1a1a1a;background-repeat:no-repeat;border:1px solid var(--line)}
.nm{font:600 17px/1.25 var(--display)}
.sa{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 14px;margin-top:4px;font-size:13px}
.kv span{min-width:0;overflow-wrap:anywhere}
.kv b{font-weight:500;color:var(--muted)}
.miss{color:var(--miss);font-style:italic}
.tag{display:inline-block;background:var(--warn-bg);color:var(--warn-fg);border-radius:4px;padding:1px 6px;font-size:12px;margin:3px 4px 0 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.more{margin:14px 0;text-align:center}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.86);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);color:var(--fg);border-radius:10px;max-width:660px;width:100%;max-height:100%;overflow:auto;padding:14px}
.big{margin-bottom:8px;width:100%;aspect-ratio:600/470;background-color:#141414;background-repeat:no-repeat;border-radius:6px}
.card h2{font:600 22px/1.2 var(--display);margin:12px 0 2px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:14px}
.card dt{color:var(--muted)}.card dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:700px){
  .grid{grid-template-columns:1fr}
  .row{grid-template-columns:72px minmax(0,1fr);gap:4px 12px}
  .stt{display:none}
  .th{width:72px;height:57px}
}
.eform{display:grid;gap:8px;margin-top:10px}.eform label{margin:0}.eform hr{border:0;border-top:1px solid var(--line);width:100%}
</style>

  const fields={'Tên thánh':g('tt'),'Tên gọi':g('tg'),'Ngày sinh':g('sinh'),'Ngày mất':g('mat'),'Quê quán':g('que'),'Giới tính':$('e_gd').value,'Tuổi':g('ag'),'Thông tin khác':g('kh')};
  msg.textContent='Đang lưu…';document.querySelectorAll('.sv').forEach(b=>b.disabled=true);
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'edit',phone,name,id:ma,fields})});
    const j=await res.json();
    if(!j.ok){msg.textContent=j.error||'Không lưu được.';document.querySelectorAll('.sv').forEach(b=>b.disabled=false);return}
    LS.set('gx_phone',phone);LS.set('gx_name',name);
    const p=pdate(g('mat')),s=pdate(g('sinh'));
    Object.assign(r,{tt:g('tt'),tg:g('tg'),sinh:s.t,mat:p.t,que:g('que'),kh:g('kh'),gd:$('e_gd').value,yy:p.y||'',mm:p.m||'',dd:p.d||'',ag:g('ag')===''?((s.y&&p.y&&p.y>=s.y)?p.y-s.y:''):parseInt(g('ag'))});
    r.key=norm([r.tt,r.tg,r.que,r.kh,r.sinh,r.mat].join(' '));r.nk=norm(r.tg);r.tk=norm(r.tt);r.nw=wordsOf(r.tt+' '+r.tg);r.nwn=r.nw.map(norm);r.by=s.y||0;r.bm=s.m||0;r.bd=s.d||0;filter();open(r,true);
    const n=document.createElement('p');n.className='sa';n.textContent=j.changed?`Đã lưu. Số điện thoại này còn sửa được ${j.left} ngôi mộ nữa.`:'Không có thay đổi nào.';$('lb').querySelector('.card').appendChild(n);
  }catch(e){msg.textContent='Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.';document.querySelectorAll('.sv').forEach(b=>b.disabled=false)}
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('lb').hidden)close()});
function fromHash(){const h=decodeURIComponent(location.hash.slice(1)).replace(/-/g,'_');if(!h)return;const r=rows.find(x=>x.file===h||x.ex.includes(h));if(r)open(r,true)}
addEventListener('hashchange',fromHash);
setup();filter();fromHash();
</script>
</body></html>
